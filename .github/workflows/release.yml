name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install release dependencies
        run: python -m pip install --upgrade build setuptools twine wheel

      - name: Build package from tag
        env:
          PKG_VERSION: ${{ github.ref_name }}
        run: make build

      - name: Validate generated package
        run: |
          python -m pip install ./src
          python -m compileall -q src/wodby

      - name: Extract release notes from tag
        run: |
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must have a description"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi

      - name: Publish package to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          PYPI_USERNAME: ${{ secrets.PYPI_USERNAME }}
          PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          if [[ -n "${PYPI_TOKEN}" ]]; then
            export PYPI_USERNAME='__token__'
            export PYPI_PASSWORD="${PYPI_TOKEN}"
          fi

          if [[ -z "${PYPI_USERNAME}" || -z "${PYPI_PASSWORD}" ]]; then
            echo "Skipping PyPI publish because PYPI_TOKEN or PYPI_USERNAME/PYPI_PASSWORD is not configured."
            exit 0
          fi

          make release
