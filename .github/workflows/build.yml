name: Build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./src -r requirements-dev.txt
      - run: python -W error::DeprecationWarning -m unittest discover -s tests -p 'test_*.py'
      - run: python -m build ./src
      - run: python -m pip_audit -r requirements.txt
